<!DOCTYPE html>

<head>

<body class="bg-light">

    <button py-click="new_member" class="btn btn-info w-100">Enter</button>

    <div id="result" class="mt-4 text-center"></div>

    <a>Drill 2 - 2nd Quarter - Balasico</a>
